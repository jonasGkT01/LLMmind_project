# similarity measures used to find nearest neighbours; every analysis runs once per measure
similarity_types:
  - "cosine"
  - "pearson"
  - "spearman"

# datasets to process; each has its own block below
datasets:
  - "caption_scene"
  - "narratives"
  - "nature_stories"
  - "nsd_data"

caption_scene:
  # numbers of nearest neighbours k; every analysis runs once per k
  number_of_neighbours: [5, 25, 125]
  bold_glob: "resources/datasets/caption_scene_dataset/V1/derivatives/pp_data/sub-*/func/sub-*_ses-*_task-CSD_run-*.nii.gz"
  # T1w registered to MNI; the BOLD data are aligned to it. Each subject has four repeated T1w
  # scans on one grid, and run-001 matches the mean BOLD image at least as well as the others
  t1w_pattern: "resources/datasets/caption_scene_dataset/V1/sub-{subject}/anat/sub-{subject}_ses-01_run-001_T1w.nii.gz"
  processing_output_dir: "results/mind/caption_scene"
  # one stimulus folder per stimulus type; the file names are the concept names
  stimuli_dir:
    language: "resources/datasets/caption_scene_dataset/V1/stimuli/transcripts"
    vision: "resources/datasets/caption_scene_dataset/V1/stimuli/COCO_CN/All_images_480"
  # stimuli without an ISC, left out of every analysis (written by the workflow)
  excluded_stimuli: "resources/datasets/caption_scene_dataset/V1/excluded_stimuli.txt"
  # flag file touched once the stimulus files have been written
  stimuli_ready: "resources/datasets/caption_scene_dataset/V1/.stimuli_ready"
  subjects: 8
  tr: 2.0
  # shift of each event window relative to the stimulus onset, in seconds
  onset_shift_s: 0.0
  # length of each event window, in seconds (caption, blank, image and fixation: 4 x 3 s)
  event_duration_s: 12.0
  # text encoding of the dataset's run tables
  run_table_encoding: "gbk"
  # an atlas voxel is sampled only if its warped field-of-view mask is at least this value,
  # i.e. it maps (almost) fully inside the native field of view
  inside_threshold: 0.999
  # spline order when sampling the BOLD volumes on the atlas grid: cubic, as in NSD's own
  # func1pt8-to-MNI mapping (nsd_data map_interpolation)
  spline_order: 3

narratives:
  number_of_neighbours: 5
  # BOLD file name; the placeholders are filled from subjects, tasks, run_tags, spaces,
  # resolutions and descriptors below
  bold_pattern: "resources/datasets/narratives_dataset/derivatives/afni-smooth/sub-{subject}/func/sub-{subject}_task-{task}{run_tag}_space-{space}_res-{resolution}_desc-{descriptor}_bold.nii.gz"
  # the dataset authors' list of scans to leave out
  scans_to_be_excluded: "resources/datasets/narratives_dataset/scan_exclude.json"
  processing_output_dir: "results/mind/narratives"
  stimuli_dir:
    language: "resources/datasets/narratives_dataset/stimuli/transcripts_renamed"
  excluded_stimuli: "resources/datasets/narratives_dataset/excluded_stimuli.txt"
  stimuli_ready: "resources/datasets/narratives_dataset/.stimuli_ready"
  subjects: 345
  tasks:
    - "21styear"
    - "bigbang"
    - "black"
    - "bronx"
    - "forgot"
    - "friends"
    - "himym"
    - "lucy"
    - "merlin"
    - "milkywayoriginal"
    - "milkywaysynonyms"
    - "milkywayvodka"
    - "notthefallintact"
    - "notthefalllongscram"
    - "notthefallshortscram"
    - "pieman"
    - "piemanpni"
    - "prettymouth"
    - "santa"
    - "seinfeld"
    - "shame"
    - "shapesphysical"
    - "shapessocial"
    - "sherlock"
    - "slumlordreach"
    - "tunnel"
    - "upintheair"
    - "vinny"
  # run suffixes of the BOLD file names ("" for single-run tasks)
  run_tags:
    - ""
    - "_run-1"
    - "_run-2"
  spaces:
    - "MNI152NLin2009cAsym"
  resolutions:
    - "native"
  descriptors:
    - "clean"
  # tasks left out of the analysis (no ISC, transcripts added to excluded_stimuli), in two groups:
  # the schema sub-stories
  schema_subtasks:
    - "bigbang"
    - "friends"
    - "himym"
    - "santa"
    - "seinfeld"
    - "shame"
    - "upintheair"
    - "vinny"
  # and the two scrambled versions of "Not the Fall"
  notthefall_variants:
    - "notthefalllongscram"
    - "notthefallshortscram"

nature_stories:
  number_of_neighbours: 3
  processing_output_dir: "results/mind/nature_stories"
  stimuli_dir:
    language: "resources/datasets/nature_stories_dataset/stimuli/transcripts"
  # the dataset's preprocessed responses and its native-voxel-to-fsaverage mappers
  responses_dir: "resources/datasets/nature_stories_dataset/responses"
  mappers_dir: "resources/datasets/nature_stories_dataset/mappers"
  # onset and length of each training story within the concatenated training responses
  # (zRresp); the dataset's original file is responses/run_onsets.json
  run_onsets: "resources/datasets/nature_stories_dataset/responses/new_run_onsets.json"
  textgrids_dir: "resources/datasets/nature_stories_dataset/stimuli/textgrids"
  excluded_stimuli: "resources/datasets/nature_stories_dataset/excluded_stimuli.txt"
  stimuli_ready: "resources/datasets/nature_stories_dataset/.stimuli_ready"
  subjects: 11

nsd_data:
  number_of_neighbours: [5, 25, 125]
  dataset_dir: "resources/datasets/nsd_data_dataset"
  processing_output_dir: "results/mind/nsd_data"
  # the dataset's images, exported to stimuli_dir by the workflow
  stimuli_hdf5: "resources/datasets/nsd_data_dataset/nsddata_stimuli/stimuli/nsd/nsd_stimuli.hdf5"
  stimuli_dir:
    vision: "resources/datasets/nsd_data_dataset/stimuli/images"
  excluded_stimuli: "resources/datasets/nsd_data_dataset/excluded_stimuli.txt"
  stimuli_ready: "resources/datasets/nsd_data_dataset/.stimuli_ready"
  subjects: 8
  tr: 1.3333333333333333
  event_duration_s: 4.0
  # shift of each event window relative to the stimulus onset, in volumes
  onset_shift_volumes: 0
  # interpolation used by NSD's own func1pt8-to-MNI mapping
  map_interpolation: "cubic"

# Schaefer atlas used for the parcellation: number of parcels and of Yeo networks
atlas:
  atlas_dir: "resources/atlases"
  n_rois: 200
  yeo_networks: 7