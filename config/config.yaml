similarity_metrics:
  - "cosine"
  - "pearson"

datasets:
  - "narratives"
#  - "caption_scene"

narratives:
  number_of_neighbours: 5
  bold_pattern: "resources/datasets/narratives_dataset/derivatives/afni-smooth/sub-{subject}/func/sub-{subject}_task-{task}{run_tag}_space-{space}_res-{resolution}_desc-{descriptor}_bold.nii.gz"
  scans_to_be_excluded: "resources/datasets/narratives_dataset/scan_exclude.json"
  excluded_scans_for_task: "resources/datasets/narratives_dataset/excluded_scans_for_task.json"
  processing_output_dir: "results/mind/narratives"
  stimuli_dir: 
    language: "resources/datasets/narratives_dataset/stimuli/transcripts_renamed"
  excluded_stimuli: "resources/datasets/narratives_dataset/excluded_stimuli.txt"
  stimuli_ready: "resources/datasets/narratives_dataset/.stimuli_ready"
  subjects: 345
  tasks:
    - "21styear"
    - "bigbang"
    - "black"
    - "bronx"
    - "forgot"
    - "friends"
    - "himym"
    - "lucy"
    - "merlin"
    - "milkywayoriginal"
    - "milkywaysynonyms"
    - "milkywayvodka"
    - "notthefallintact"
    - "notthefalllongscram"
    - "notthefallshortscram"
    - "pieman"
    - "piemanpni"
    - "prettymouth"
    - "santa"
    - "seinfeld"
    - "shame"
    - "shapesphysical"
    - "shapessocial"
    - "sherlock"
    - "slumlordreach"
    - "tunnel"
    - "upintheair"
    - "vinny"
  run_tags:
    - ""
    - "_run-1"
    - "_run-2"
  spaces:
    - "MNI152NLin2009cAsym"
  resolutions:
    - "native"
  descriptors:
    - "clean"
  schema_subtasks:
    - "bigbang"
    - "friends"
    - "himym"
    - "santa"
    - "seinfeld"
    - "shame"
    - "upintheair"
    - "vinny"
  notthefall_variants:
    - "notthefalllongscram"
    - "notthefallshortscram"
  problematic_subtasks:
    - "bigbang"
    - "friends"
    - "himym"
    - "santa"
    - "seinfeld"
    - "shame"
    - "upintheair"
    - "vinny"
    - "notthefalllongscram"
    - "notthefallshortscram"

caption_scene:
  number_of_neighbours: 5
  bold_glob: "resources/datasets/caption_scene_dataset/V1/derivatives/pp_data/sub-*/func/sub-*_ses-*_task-CSD_run-*.nii.gz"
  scans_to_be_excluded: "resources/datasets/caption_scene_dataset/scan_exclude.json"
  excluded_scans_for_task: "resources/datasets/caption_scene_dataset/excluded_scans_for_task.json"
  processing_output_dir: "results/mind/caption_scene"
  stimuli_dir: 
    language: "resources/datasets/caption_scene_dataset/V1/stimuli/transcripts"
    visual: "resources/datasets/caption_scene_dataset/V1/stimuli/COCO_CN/All_images_480"
  excluded_stimuli: "resources/datasets/caption_scene_dataset/V1/excluded_stimuli.txt"
  stimuli_ready: "resources/datasets/caption_scene_dataset/V1/.stimuli_ready"
  subjects: 8
  tr: 2.0
  onset_shift_s: 0.0
  event_duration_s: 12.0
  run_table_encoding: "gbk"

atlas:
  atlas_dir: "resources/atlases"
  n_rois: 200
  yeo_networks: 7